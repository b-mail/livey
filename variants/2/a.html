<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파트너 정산</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --sidebar: #ffffff;
    --border: #e5e7eb;
    --ink: #111827;
    --ink-2: #4b5563;
    --ink-3: #9ca3af;
    --accent: #2f4fd8;
    --accent-soft: #eef1fd;
    --row-hover: #f8fafc;
    --bar: #2f4fd8;
    --bar-track: #eef0f4;
    --good: #15803d;
    --wait: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1014;
      --surface: #151a21;
      --sidebar: #12161c;
      --border: #262d38;
      --ink: #f3f4f6;
      --ink-2: #b6bdc9;
      --ink-3: #737c8c;
      --accent: #8fa6ff;
      --accent-soft: #1d2537;
      --row-hover: #1b222b;
      --bar: #8fa6ff;
      --bar-track: #222933;
      --good: #4ade80;
      --wait: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1014;
    --surface: #151a21;
    --sidebar: #12161c;
    --border: #262d38;
    --ink: #f3f4f6;
    --ink-2: #b6bdc9;
    --ink-3: #737c8c;
    --accent: #8fa6ff;
    --accent-soft: #1d2537;
    --row-hover: #1b222b;
    --bar: #8fa6ff;
    --bar-track: #222933;
    --good: #4ade80;
    --wait: #fbbf24;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
                 "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app { display: flex; min-height: 100vh; }

  /* ---------- 사이드바 ---------- */
  .sidebar {
    width: 216px;
    flex: 0 0 216px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: 22px 12px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 10px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .brand .dot {
    width: 20px; height: 20px;
    border-radius: 6px;
    background: var(--accent);
    flex: none;
  }

  nav { display: flex; flex-direction: column; gap: 2px; }

  .nav-label {
    font-size: 11px;
    color: var(--ink-3);
    padding: 0 10px 6px;
    letter-spacing: 0.02em;
  }

  .nav-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-radius: 7px;
    padding: 8px 10px;
    font: inherit;
    font-size: 14px;
    color: var(--ink-2);
    cursor: pointer;
  }

  .nav-item:hover { background: var(--row-hover); color: var(--ink); }

  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 550;
  }

  .sidebar-foot {
    margin-top: auto;
    padding: 10px;
    font-size: 12px;
    color: var(--ink-3);
    border-top: 1px solid var(--border);
  }

  /* ---------- 본문 ---------- */
  main { flex: 1; min-width: 0; padding: 36px 32px 64px; }
  .inner { max-width: 880px; }

  header { margin-bottom: 26px; }
  h1 { margin: 0 0 4px; font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
  .period { color: var(--ink-3); font-size: 13px; }

  h2 {
    margin: 32px 0 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-2);
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 4px;
  }

  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .tile .label { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
  .tile .value {
    font-size: 20px; font-weight: 650;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .tile.primary .value { color: var(--accent); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }

  th {
    text-align: left;
    font-size: 12px; font-weight: 550;
    color: var(--ink-3);
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 13px 18px;
    border-bottom: 1px solid var(--border);
    color: var(--ink-2);
    white-space: nowrap;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--row-hover); }

  .num { text-align: right; }
  .partner { color: var(--ink); font-weight: 500; }
  .settle { color: var(--ink); font-weight: 550; }

  /* 상태 — 색만으로 구분하지 않도록 점 + 라벨을 함께 씀 */
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .status .mark { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .status.done { color: var(--good); }
  .status.done .mark { background: var(--good); }
  .status.wait { color: var(--wait); }
  .status.wait .mark { background: var(--wait); }

  /* 파트너별 정산액 막대 */
  .bars { display: flex; flex-direction: column; gap: 2px; padding: 6px 0; }
  .bar-row {
    display: grid;
    grid-template-columns: 96px 1fr 116px;
    align-items: center;
    gap: 12px;
    padding: 7px 18px;
  }
  .bar-row .name { font-size: 13px; color: var(--ink); }
  .bar-track { background: var(--bar-track); border-radius: 4px; height: 10px; }
  .bar-fill { background: var(--bar); border-radius: 4px; height: 100%; }
  .bar-row .val {
    text-align: right; font-size: 13px;
    color: var(--ink-2); font-variant-numeric: tabular-nums;
  }

  /* 정산 내역 — 파트너 칩 필터 */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: 999px;
    padding: 5px 12px;
    font: inherit; font-size: 13px;
    cursor: pointer;
  }
  .chip .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .chip:hover { color: var(--ink); border-color: var(--ink-3); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .75; }
  .chip:focus-visible, .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .sidebar {
      width: auto; flex: none;
      border-right: 0; border-bottom: 1px solid var(--border);
      flex-direction: row; align-items: center;
      gap: 14px; padding: 12px 14px; overflow-x: auto;
    }
    .sidebar .nav-label, .sidebar-foot { display: none; }
    nav { flex-direction: row; gap: 4px; }
    .nav-item { white-space: nowrap; padding: 6px 12px; }
    main { padding: 24px 16px 48px; }
    .summary { grid-template-columns: 1fr; }
    th, td { padding-left: 12px; padding-right: 12px; }
    .bar-row { grid-template-columns: 78px 1fr 100px; padding-left: 12px; padding-right: 12px; }
    body { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>정산 콘솔</div>
    <nav id="nav">
      <div class="nav-label">메뉴</div>
    </nav>
    <div class="sidebar-foot">데모 계정 · 2026 Q3</div>
  </aside>

  <main>
    <div class="inner">
      <header>
        <h1 id="title"></h1>
        <div class="period" id="subtitle"></div>
      </header>
      <div id="body"></div>
    </div>
  </main>

</div>

<script>
  /* ── 거래 원장. 수수료율은 파트너별 계약 요율. ───────────────── */
  const DATA = [
    { date: '2026-08-04', partner: '스타일리브', amount: 4_820_000, rate: 0.032 },
    { date: '2026-08-09', partner: '그린마켓',   amount: 1_150_000, rate: 0.028 },
    { date: '2026-08-15', partner: '데일리핏',   amount: 7_340_000, rate: 0.035 },
    { date: '2026-08-21', partner: '하우스오브', amount: 2_690_000, rate: 0.030 },
    { date: '2026-08-27', partner: '스타일리브', amount: 5_410_000, rate: 0.032 },
    { date: '2026-08-30', partner: '모던키친',   amount:   880_000, rate: 0.028 },
    { date: '2026-09-02', partner: '데일리핏',   amount: 6_120_000, rate: 0.035 },
    { date: '2026-09-06', partner: '그린마켓',   amount: 1_970_000, rate: 0.028 },
    { date: '2026-09-11', partner: '하우스오브', amount: 3_450_000, rate: 0.030 },
    { date: '2026-09-14', partner: '스타일리브', amount: 4_060_000, rate: 0.032 },
    { date: '2026-09-17', partner: '모던키친',   amount: 1_240_000, rate: 0.028 },
    { date: '2026-09-19', partner: '데일리핏',   amount: 8_930_000, rate: 0.035 },
  ];

  /* ── 계산 ──────────────────────────────────────────────────── */
  const won     = n => '₩' + Math.round(n).toLocaleString('ko-KR');
  const fee     = r => r.amount * r.rate;
  const settled = r => r.amount - fee(r);
  const sum     = (rows, f) => rows.reduce((s, r) => s + f(r), 0);
  const byDate  = rows => [...rows].sort((a, b) => a.date.localeCompare(b.date));
  const ymd     = d => d.replace(/-/g, '.').slice(2);
  const month   = d => d.slice(0, 7);

  const groupBy = (rows, key) => rows.reduce((m, r) => {
    (m[key(r)] ||= []).push(r);
    return m;
  }, {});

  /* ── 공용 조각 ─────────────────────────────────────────────── */
  const tiles = items => `<section class="summary">${items.map(
    ([label, value, cls]) => `
      <div class="tile ${cls || ''}">
        <div class="label">${label}</div>
        <div class="value">${value}</div>
      </div>`).join('')}</section>`;

  const table = (cols, rows) => `
    <div class="card">
      <table>
        <thead><tr>${cols.map(c =>
          `<th class="${c.num ? 'num' : ''}">${c.label}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r =>
          `<tr>${r.map((cell, i) =>
            `<td class="${cols[i].num ? 'num' : ''} ${cols[i].cls || ''}">${cell}</td>`
          ).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>`;

  const status = (kind, label) =>
    `<span class="status ${kind}"><span class="mark"></span>${label}</span>`;

  /* ── 정산 내역 필터 상태 ─────────────────────────────────── */
  let partnerFilter = null;   // null = 전체
  const ledgerRows = () =>
    byDate(DATA).filter(r => !partnerFilter || r.partner === partnerFilter);

  function setPartner(name) {
    partnerFilter = name || null;
    render('settlements');
    document.querySelector(`.chip[data-partner="${name}"]`)?.focus();
  }

  /* ── 화면 ──────────────────────────────────────────────────── */
  const VIEWS = {

    settlements: {
      nav: '정산 내역',
      title: '정산 내역',
      subtitle: () => `2026년 8월 1일 – 9월 19일 · ${ledgerRows().length}건`
        + (partnerFilter ? ` · ${partnerFilter}` : ''),
      render() {
        const rows = ledgerRows();
        const total = sum(rows, r => r.amount);
        const feeSum = sum(rows, fee);
        const counts = groupBy(DATA, r => r.partner);
        const chip = (value, label, n) => `
          <button type="button" class="chip" data-partner="${value}"
                  aria-pressed="${(partnerFilter || '') === value}"
                  onclick="setPartner('${value}')">${label}<span class="n">${n}</span></button>`;

        return tiles([
          ['총 거래액', won(total)],
          ['총 수수료', won(feeSum)],
          ['정산 예정액', won(total - feeSum), 'primary'],
        ]) + '<h2>거래 원장</h2>'
          + `<div class="chips" role="group" aria-label="파트너로 거르기">${
              chip('', '전체', DATA.length)
              + Object.entries(counts).map(([name, rs]) => chip(name, name, rs.length)).join('')
            }</div>`
          + table(
          [{ label: '거래일' }, { label: '파트너명', cls: 'partner' },
           { label: '거래액', num: true }, { label: '수수료', num: true },
           { label: '정산액', num: true, cls: 'settle' }],
          rows.map(r => [ymd(r.date), r.partner, won(r.amount), won(fee(r)), won(settled(r))])
        );
      }
    },

    overview: {
      nav: '대시보드',
      title: '대시보드',
      subtitle: '2026년 8월 1일 – 9월 19일',
      render() {
        const total = sum(DATA, r => r.amount);
        const feeSum = sum(DATA, fee);
        const groups = groupBy(DATA, r => r.partner);
        const ranked = Object.entries(groups)
          .map(([name, rows]) => [name, sum(rows, settled)])
          .sort((a, b) => b[1] - a[1]);
        const max = ranked[0][1];

        return tiles([
          ['총 거래액', won(total)],
          ['거래 건수', DATA.length + '건'],
          ['정산 예정액', won(total - feeSum), 'primary'],
        ]) + `
          <h2>파트너별 정산액</h2>
          <div class="card"><div class="bars">${ranked.map(([name, v]) => `
            <div class="bar-row">
              <span class="name">${name}</span>
              <span class="bar-track"><span class="bar-fill" style="width:${(v / max * 100).toFixed(1)}%"></span></span>
              <span class="val">${won(v)}</span>
            </div>`).join('')}</div></div>

          <h2>최근 거래</h2>` + table(
            [{ label: '거래일' }, { label: '파트너명', cls: 'partner' },
             { label: '정산액', num: true, cls: 'settle' }],
            byDate(DATA).slice(-5).reverse()
              .map(r => [ymd(r.date), r.partner, won(settled(r))])
          );
      }
    },

    partners: {
      nav: '파트너',
      title: '파트너',
      subtitle: '계약 요율 및 누적 실적 · 5개사',
      render() {
        const groups = groupBy(DATA, r => r.partner);
        const rows = Object.entries(groups)
          .map(([name, rs]) => ({
            name, rate: rs[0].rate, count: rs.length,
            amount: sum(rs, r => r.amount), settle: sum(rs, settled),
          }))
          .sort((a, b) => b.settle - a.settle);

        return table(
          [{ label: '파트너명', cls: 'partner' }, { label: '계약 요율', num: true },
           { label: '거래 건수', num: true }, { label: '거래액', num: true },
           { label: '누적 정산액', num: true, cls: 'settle' }],
          rows.map(r => [r.name, (r.rate * 100).toFixed(1) + '%',
                         r.count + '건', won(r.amount), won(r.settle)])
        );
      }
    },

    payouts: {
      nav: '지급 관리',
      title: '지급 관리',
      subtitle: '월별 정산 회차 · 지급일은 익월 10일',
      render() {
        const groups = groupBy(DATA, r => month(r.date) + '|' + r.partner);
        const rows = Object.entries(groups).map(([key, rs]) => {
          const [m, partner] = key.split('|');
          const done = m === '2026-08';
          return {
            m, partner, count: rs.length, settle: sum(rs, settled),
            payDate: done ? '26.09.10' : '26.10.10',
            state: done ? status('done', '지급완료') : status('wait', '지급예정'),
          };
        }).sort((a, b) => b.m.localeCompare(a.m) || b.settle - a.settle);

        const pending = rows.filter(r => r.m === '2026-09');

        return tiles([
          ['이번 회차 지급예정', won(sum(pending, r => r.settle)), 'primary'],
          ['지급예정 건수', pending.length + '건'],
          ['다음 지급일', '2026.10.10'],
        ]) + '<h2>회차별 지급</h2>' + table(
          [{ label: '정산 회차' }, { label: '파트너명', cls: 'partner' },
           { label: '거래 건수', num: true }, { label: '지급액', num: true, cls: 'settle' },
           { label: '지급일' }, { label: '상태' }],
          rows.map(r => [r.m.replace('-', '년 ') + '월', r.partner,
                         r.count + '건', won(r.settle), r.payDate, r.state])
        );
      }
    },
  };

  /* ── 라우팅 ────────────────────────────────────────────────── */
  const ORDER = ['overview', 'settlements', 'partners', 'payouts'];
  let current = 'settlements';   // 데모는 정산 내역 화면에서 시작한다

  function render(key = current) {
    current = key;
    const view = VIEWS[key];
    document.getElementById('title').textContent = view.title;
    document.getElementById('subtitle').textContent =
      typeof view.subtitle === 'function' ? view.subtitle() : view.subtitle;
    document.getElementById('body').innerHTML = view.render();
    document.querySelectorAll('.nav-item').forEach(b =>
      b.classList.toggle('active', b.dataset.key === key));
  }

  const nav = document.getElementById('nav');
  ORDER.forEach(key => {
    const b = document.createElement('button');
    b.className = 'nav-item';
    b.dataset.key = key;
    b.textContent = VIEWS[key].nav;
    b.onclick = () => render(key);
    nav.appendChild(b);
  });

  render();
</script>
</body>
</html>
